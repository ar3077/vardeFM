language = "C"
include_guard = "VARDEFM_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen. Do not edit by hand; regenerate with: cbindgen -c crates/vardefm-ffi/cbindgen.toml -o crates/vardefm-ffi/include/CVardeFM/vardefm.h crates/vardefm-ffi */"
include_version = true
documentation = true
documentation_style = "c99"
style = "both"

[export]
include = [
  "VfmConfig",
  "VfmTxReport",
  "VfmRxReport",
  "VfmCallbacks",
  "VfmModem",
  "VFM_MODE_NARROW",
  "VFM_MODE_WIDE",
  "VFM_RATE",
  "VFM_LEVEL_COUNT",
]
item_types = ["enums", "structs", "functions", "constants", "opaque"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
prefix = ""

[parse]
parse_deps = false
